<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 中文维护</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>Claude 中文维护</h1>
<p id="mode">正在读取应用信息…</p>
<section id="paths" aria-label="检测到的位置"></section>
<section>
<h2>常用</h2>
<div class="field">
<label for="locale-select">语言</label>
<select id="locale-select" disabled>
<option value="zh-Hans">简体中文</option>
<option value="zh-Hant">繁體中文</option>
</select>
</div>
<div class="actions">
<button type="button" data-action="status" disabled>刷新状态</button>
<button type="button" data-action="check" data-mode="original" disabled>检查兼容性</button>
</div>
<p id="guard" class="note"></p>
</section>
<section>
<details>
<summary>高级操作</summary>
<p class="note">Claude 4.x 使用运行时加载；以下资源写入仅适用于旧版未打包目录。</p>
<div class="actions">
<button type="button" data-action="install" data-mode="original" data-write="true" disabled>写入语言资源</button>
<button type="button" data-action="switch" data-write="true" disabled>切换语言</button>
<button type="button" data-action="restore" data-write="true" disabled>恢复原始语言</button>
<button type="button" data-action="plan" disabled>查看计划</button>
<button type="button" data-action="detect" disabled>检查网关</button>
<button type="button" data-action="import-cache" data-write="true" disabled>导入语言缓存</button>
<button type="button" data-action="prepare" data-mode="copy" data-write="true" disabled>创建测试副本</button>
<button type="button" data-action="launch" data-mode="copy" disabled>启动测试副本</button>
</div>
</details>
</section>
<section>
<h2>结果</h2>
<pre id="log" role="status">还没有操作。</pre>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>

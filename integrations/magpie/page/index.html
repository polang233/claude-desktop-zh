<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 中文</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script src="app.js?v=settings-6" defer></script>
</head>
<body>
<main>
<div class="plugin-heading"><img src="icon.png" width="64" height="64" alt=""><div><h1>Claude 中文</h1><span>claude-desktop-zh</span></div></div>
<p class="summary">为第三方模式加载官方中文，保留原有设置和会话。</p>
<label class="field" for="locale"><span>语言</span><select id="locale"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label>
<label class="check"><input id="runtime-auto" type="checkbox" checked>启动时加载中文</label>
<div class="actions"><button id="save" type="button">保存</button><p id="status" role="status" aria-live="polite"></p></div>
<p class="note">保存后下次打开 Claude 生效。使用期间保持 magpie 运行。</p>
</main>
</body>
</html>
